[project]
name = "swisspost-pdptw"
version = "0.1.0"
description = "Diagnostic notebooks: why do our routing results diverge from Swiss Post's values?"
requires-python = ">=3.11"
dependencies = [
    # Solvers
    "pyvrp>=0.13.3",
    # gurobipy is optional: notebooks guard every Gurobi cell with try/except.
    # Uncomment if you have a license:
    # "gurobipy>=11.0",
    # Graph / geospatial
    "osmnx>=2.0.0",
    "networkx>=3.2",
    "igraph>=0.11",
    "scikit-learn>=1.4",  # required by osmnx.nearest_nodes on unprojected graphs
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    # Data
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pyarrow>=15.0",
    # Plotting / notebooks
    "matplotlib>=3.8.0",
    "folium>=0.15.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sppdptw"]

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.5"]
