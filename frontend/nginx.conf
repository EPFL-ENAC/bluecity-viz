user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;
events {
  worker_connections  1024;
}
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;
  sendfile        on;
  keepalive_timeout  65;
  server {
    listen       80;
    server_name  localhost;
    root   /app;

    # Vite puts a content hash in every file name under /assets, so these can
    # be cached for a year. Nothing else can: the names are stable and the
    # content changes on each deploy.
    location ^~ /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # The entry point, it points at the current hashed assets.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    # Map styles and layer config (style/light.json and friends) keep their
    # name across deploys, so they must be revalidated.
    location ~* \.json$ {
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }

    location / {
      index  index.html;
      try_files $uri $uri/ /index.html;
    }

    error_page   404 500 502 503 504  /50x.html;
    location = /50x.html {
      root   /usr/share/nginx/html;
    }
  }
}
