# https://github.com/EPFL-ENAC/epfl-enac-build-push-deploy-action#readme
name: deploy

# prod deploys on a v*.*.* tag, dev deploys on the dev branch.
# main is not listed on purpose: the reusable workflow maps no overlay to it,
# so a push to main would build images and deploy nothing (green but useless).
"on":
  push:
    branches:
      - dev
    tags: ["v*.*.*"]

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: EPFL-ENAC/epfl-enac-build-push-deploy-action/.github/workflows/deploy.yml@v3.1.0
    secrets:
      token: ${{ secrets.CD_TOKEN }}
    with:
      ORG: epfl-bluecity
      REPO: bluecity-viz
      build_context: '["./backend", "./frontend"]'
