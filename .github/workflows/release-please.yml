# Opens a release PR on main from the conventional commits, then tags and
# publishes the GitHub release when that PR is merged.
# The version lives in .release-please-manifest.json; the config keeps
# frontend/package.json and backend/pyproject.toml in sync with it.
name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # RELEASE_PLEASE_TOKEN is a PAT (contents + pull-requests write).
          # It is needed so the v*.*.* tag triggers deploy.yml: GitHub does not
          # run workflows on events made with the default GITHUB_TOKEN.
          # Falls back to GITHUB_TOKEN if the secret is missing, so the job
          # still opens the release PR instead of failing.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
